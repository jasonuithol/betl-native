<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>betl pipeline viewer</title>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@dagrejs/dagre@1.1.4/dist/dagre.min.js"></script>
<!-- CodeMirror 5 powers the "Expand…" SQL editor on inspector fields.
     Loaded async so the UI still boots if jsdelivr is unreachable; the
     expand button falls back to a toast in that case. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/idea.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/sql/sql.min.js"></script>
<style>
  :root {
    --bg:          #fafafa;
    --panel:       #ffffff;
    --line:        #e6e6e6;
    --line-strong: #c8c8c8;
    --text:        #222;
    --muted:       #8a8a8a;
    --head-bg:     #f5f5f7;
    --hover:       #f3f4f6;
    --badge-bg:    #eef2ff;
    --badge-fg:    #4338ca;
    --overlay:     rgba(0, 0, 0, 0.35);
    --accent:      #2563eb;
    --df:          #8b5cf6;
    --sql:         #14b8a6;
    --map:         #f59e0b;
    --script:      #ef4444;
    --container:   #6b7280;
    --leaf:        #94a3b8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body.dark {
    --bg:          #0f1115;
    --panel:       #181b20;
    --line:        #262a31;
    --line-strong: #3a3f48;
    --text:        #e7e7e7;
    --muted:       #8a8f99;
    --head-bg:     #1f242c;
    --hover:       #252a32;
    --badge-bg:    #1e1b3a;
    --badge-fg:    #a5b4fc;
    --overlay:     rgba(0, 0, 0, 0.55);
    --df:          #a78bfa;
    --sql:         #2dd4bf;
    --map:         #fbbf24;
    --script:      #f87171;
    --container:   #9ca3af;
    --leaf:        #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0; font-size: 13px; font-weight: 600;
    font-family: var(--mono);
    color: var(--muted);
  }
  header h1 .name { color: var(--text); }
  .spacer { flex: 1; }
  button.btn, label.btn {
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
    padding: 5px 10px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
  }
  button.btn:hover, label.btn:hover { background: var(--hover); }
  button.btn:disabled, label.btn.disabled {
    color: var(--muted); cursor: not-allowed; opacity: 0.55;
  }
  button.btn:disabled:hover { background: var(--panel); }
  .toggle { display: flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
  .toggle button {
    border: 0; background: var(--panel); color: var(--text);
    padding: 5px 11px; cursor: pointer; font-size: 12px; line-height: 1;
  }
  .toggle button + button { border-left: 1px solid var(--line-strong); }
  .toggle button.active { background: var(--accent); color: white; }
  .toggle button:not(.active):hover { background: var(--hover); }
  main { padding: 14px; }

  /* ----------- connection arrows ----------- */
  .v-flow .flow-canvas { position: relative; }
  .conns {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
    z-index: 0;
  }
  .conns path { fill: none; stroke: var(--muted); stroke-width: 1.5; }
  .conns .arrow-head { fill: var(--muted); }
  .conns .edge-label-bg {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 1;
  }
  .conns .edge-label {
    fill: var(--text);
    font-family: var(--mono);
    font-size: 11px;
  }
  .step { position: relative; z-index: 1; }

  /* ----------- shared: step card ----------- */
  .step {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 9px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--leaf);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    min-height: 28px;
  }
  .step.k-container   { border-left-color: var(--container); }
  .step.k-dataflow    { border-left-color: var(--df); }
  .step.k-sql         { border-left-color: var(--sql); }
  .step.k-map         { border-left-color: var(--map); }
  .step.k-script      { border-left-color: var(--script); }
  .step .id { font-weight: 600; }
  .step .ttype { color: var(--muted); font-size: 11px; }
  .step .badge {
    margin-left: auto;
    background: var(--badge-bg);
    color: var(--badge-fg);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 500;
  }
  .step .after { color: var(--muted); font-size: 11px; }
  .step .after::before { content: '\2190 '; }

  /* ----------- FLOW (dagre-laid-out graph per dataflow) ----------- */
  .v-flow .flow-section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .v-flow .flow-head {
    display: flex; align-items: baseline; gap: 12px;
    padding: 9px 14px;
    background: var(--head-bg);
    border-bottom: 1px solid var(--line);
  }
  .v-flow .flow-head .id {
    font-family: var(--mono); font-weight: 600; font-size: 13px;
  }
  .v-flow .flow-head .meta {
    color: var(--muted); font-family: var(--mono); font-size: 11px;
  }
  /* Canvas is a positioning context; dagre fills width/height inline.
   * Cards measure at their natural inline-flex size before being
   * absolute-positioned by applyFlowLayout(). */
  .v-flow .flow-canvas {
    position: relative;
    overflow: auto;
  }
  .v-flow .flow-canvas .step {
    display: inline-flex;
  }
  /* Landscape (LR) stacks each card's fields vertically so cards
   * are narrow + tall and pack into ranks left-to-right. Portrait
   * uses the default horizontal layout from .step. */
  .v-flow.landscape .flow-canvas .step {
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    min-width: 120px;
    padding: 6px 10px;
  }
  .v-flow.landscape .flow-canvas .step .badge {
    margin-left: 0;
  }
  .v-flow.landscape .flow-canvas .step .after::before {
    /* keep the back-arrow prefix for the after-tag */
    content: '\2190 ';
  }

  /* Ports mode: a multi-output step expands into a single card whose
   * body section sits above (portrait) or beside (landscape) a row /
   * column of port cells. Each cell is the visible output label and
   * the anchor for that output's arrow — applyFlowLayout() snaps the
   * dagre-routed edge's start point onto the cell's outer face. */
  .v-flow .flow-canvas .step.has-ports {
    padding: 0;
    gap: 0;
    align-items: stretch;
  }
  .v-flow.portrait  .flow-canvas .step.has-ports { flex-direction: column; }
  .v-flow.landscape .flow-canvas .step.has-ports { flex-direction: row; }
  .step.has-ports .step-body {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 9px;
    border-bottom: 1px solid var(--line);
    min-height: 28px;
  }
  .step.has-ports .step-ports {
    display: flex; flex-direction: row;
    min-height: 22px;
  }
  .step.has-ports .port-cell {
    flex: 1 1 0;
    padding: 4px 10px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    border-right: 1px solid var(--line);
    white-space: nowrap;
  }
  .step.has-ports .port-cell:last-child { border-right: 0; }
  .v-flow.landscape .flow-canvas .step.has-ports .step-body {
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    border-bottom: 0;
    border-right: 1px solid var(--line);
    padding: 6px 10px;
  }
  .v-flow.landscape .flow-canvas .step.has-ports .step-body .badge { margin-left: 0; }
  .v-flow.landscape .flow-canvas .step.has-ports .step-ports {
    flex-direction: column;
  }
  .v-flow.landscape .flow-canvas .step.has-ports .port-cell {
    border-right: 0;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }
  .v-flow.landscape .flow-canvas .step.has-ports .port-cell:last-child { border-bottom: 0; }
  .v-flow .empty {
    padding: 10px 14px;
    color: var(--muted);
    font-style: italic;
    font-size: 12px;
  }

  /* ----------- SQL editor (CodeMirror) overlay ----------- */
  .sql-modal {
    position: fixed; inset: 0;
    background: var(--overlay);
    display: none;
    align-items: stretch; justify-content: center;
    padding: 4vh 4vw;
    z-index: 400;
  }
  .sql-modal.show { display: flex; }
  .sql-modal-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    flex: 1;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }
  .sql-modal-head {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .sql-modal-head h3 {
    margin: 0; font-size: 13px; font-weight: 600;
    font-family: var(--mono);
  }
  .sql-modal-head .crumb {
    color: var(--muted); font-family: var(--mono); font-size: 11px;
  }
  .sql-modal-head .close {
    margin-left: auto;
    border: 0; background: transparent; cursor: pointer;
    color: var(--muted); font-size: 20px; line-height: 1;
    padding: 2px 6px; border-radius: 4px;
  }
  .sql-modal-head .close:hover { background: var(--hover); color: var(--text); }
  .sql-modal-body { flex: 1; min-height: 0; overflow: hidden; }
  .sql-modal-body .CodeMirror {
    height: 100%;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
  }
  .sql-modal-foot {
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    display: flex; gap: 8px; justify-content: flex-end;
    align-items: center;
  }
  .sql-modal-foot .hint {
    margin-right: auto;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }
  .field .expand-sql {
    border: 1px solid var(--line-strong);
    background: var(--panel);
    color: var(--text);
    border-radius: 4px;
    padding: 1px 8px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 10px;
    margin-left: auto;
  }
  .field .expand-sql:hover { background: var(--hover); }
  .field label { display: flex; align-items: center; gap: 6px; }

  /* ----------- metadata strip (connections + parameters) ----------- */
  .meta-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  .meta-section {
    flex: 1 1 240px;
    min-width: 200px;
  }
  .meta-section .meta-head {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .meta-section .meta-head .count {
    background: var(--badge-bg);
    color: var(--badge-fg);
    border-radius: 10px;
    padding: 0 7px;
    font-size: 10px;
    font-weight: 500;
  }
  .meta-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-left: 3px solid var(--leaf);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    line-height: 1.3;
  }
  .meta-chip:hover { background: var(--hover); }
  .meta-chip.selected {
    background: var(--hover);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .meta-chip .chip-id { font-weight: 600; }
  .meta-chip .chip-type { color: var(--muted); font-size: 11px; }
  .meta-chip.k-mssql       { border-left-color: var(--sql); }
  .meta-chip.k-postgres    { border-left-color: var(--df); }
  .meta-chip.k-param-string,
  .meta-chip.k-param-int,
  .meta-chip.k-param-date,
  .meta-chip.k-param-bool   { border-left-color: var(--map); }
  .meta-empty {
    color: var(--muted);
    font-style: italic;
    font-size: 11px;
    font-family: var(--mono);
  }

  /* ----------- validate / convert result modal ----------- */
  .tool-result .tr-banner {
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .tool-result .tr-banner.ok  { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .tool-result .tr-banner.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  body.dark .tool-result .tr-banner.ok  { background: #052e1e; color: #6ee7b7; border-color: #064e3b; }
  body.dark .tool-result .tr-banner.err { background: #2d0e0e; color: #fca5a5; border-color: #5c1d1d; }
  .tool-result .tr-cmd {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    word-break: break-all;
  }
  .tool-result h4 {
    margin: 12px 0 4px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .tool-result pre {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 0;
    overflow: auto;
    max-height: 35vh;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  /* ----------- source-mode editor ----------- */
  .src-pane {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  #srcEditor {
    display: block;
    width: 100%;
    min-height: calc(100vh - 130px);
    border: 0;
    outline: 0;
    resize: vertical;
    padding: 14px 16px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
    white-space: pre;
    overflow: auto;
    tab-size: 2;
  }
  #srcEditor:focus { background: var(--panel); }

  /* ----------- parse error panel ----------- */
  .parse-error {
    background: var(--panel);
    border: 1px solid var(--script);
    border-left: 4px solid var(--script);
    border-radius: 8px;
    padding: 14px 18px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    max-width: 900px;
  }
  .parse-error .pe-head {
    font-weight: 600;
    color: var(--script);
    margin-bottom: 4px;
  }
  .parse-error .pe-head code {
    color: var(--text);
    font-weight: 500;
    background: var(--head-bg);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .parse-error .pe-where {
    color: var(--muted);
    margin-bottom: 8px;
  }
  .parse-error .pe-reason {
    margin-bottom: 10px;
    white-space: pre-wrap;
  }
  .parse-error pre.pe-snippet {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 0;
    overflow: auto;
    font-size: 11px;
    line-height: 1.5;
    white-space: pre;
  }
  .parse-error .pe-foot {
    display: flex; justify-content: flex-end;
    margin-top: 12px;
  }

  /* ----------- path crumb in header ----------- */
  .pathcrumb {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 40vw;
  }
  .pathcrumb .dirty::after { content: ' *'; color: var(--map); }

  /* ----------- modal ----------- */
  .modal {
    position: fixed; inset: 0;
    background: var(--overlay);
    display: none;
    align-items: flex-start; justify-content: center;
    padding-top: 8vh;
    z-index: 200;
  }
  .modal.show { display: flex; }
  .modal-card {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    width: min(640px, 92vw);
    max-height: 80vh;
    display: flex; flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .modal-head {
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .modal-head h3 {
    margin: 0; font-size: 13px; font-weight: 600;
    font-family: var(--mono);
  }
  .modal-head .close {
    margin-left: auto;
    border: 0; background: transparent; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
    padding: 2px 6px; border-radius: 4px;
  }
  .modal-head .close:hover { background: var(--hover); color: var(--text); }
  .modal-body { padding: 10px 14px; overflow-y: auto; }
  .modal-foot {
    padding: 10px 14px;
    border-top: 1px solid var(--line);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .modal-foot .btn.primary {
    background: var(--accent); color: white; border-color: var(--accent);
  }
  .modal-foot .btn.primary:hover { background: var(--accent); filter: brightness(1.1); }

  .bcrumb {
    font-family: var(--mono); font-size: 12px;
    padding: 4px 0 8px;
    color: var(--muted);
  }
  .bcrumb .root { color: var(--text); font-weight: 600; }
  .entries { display: flex; flex-direction: column; gap: 2px; }
  .entry {
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-family: var(--mono); font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .entry:hover { background: var(--hover); }
  .entry .icon { width: 16px; text-align: center; color: var(--muted); }
  .entry.dir .name { font-weight: 500; }
  .entry .size { margin-left: auto; color: var(--muted); font-size: 11px; }

  .saveform { display: flex; flex-direction: column; gap: 8px; }
  .saveform label { font-size: 12px; color: var(--muted); }
  .saveform input {
    border: 1px solid var(--line-strong);
    background: var(--bg);
    color: var(--text);
    border-radius: 5px;
    padding: 7px 10px;
    font-family: var(--mono);
    font-size: 12px;
    outline: none;
  }
  .saveform input:focus { border-color: var(--accent); }
  .saveform .hint { font-size: 11px; color: var(--muted); }
  .saveform .err { color: var(--script); }

  /* ----------- toast ----------- */
  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    font-family: var(--mono);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--script); color: white; }

  /* ----------- step click affordances ----------- */
  [data-path] { cursor: pointer; }
  [data-path]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .step[data-path]:hover { background: var(--hover); }
  .step[data-path].selected {
    background: var(--hover);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .section-head[data-path], .col-head[data-path], .pane-head[data-path] {
    border-left: 3px solid var(--leaf);
  }
  .section-head[data-path].k-container, .col-head[data-path].k-container, .pane-head[data-path].k-container { border-left-color: var(--container); }
  .section-head[data-path].k-dataflow,  .col-head[data-path].k-dataflow,  .pane-head[data-path].k-dataflow  { border-left-color: var(--df); }
  .section-head[data-path].k-sql,       .col-head[data-path].k-sql,       .pane-head[data-path].k-sql       { border-left-color: var(--sql); }
  .section-head[data-path].k-map,       .col-head[data-path].k-map,       .pane-head[data-path].k-map       { border-left-color: var(--map); }
  .section-head[data-path].k-script,    .col-head[data-path].k-script,    .pane-head[data-path].k-script    { border-left-color: var(--script); }
  .section-head[data-path]:hover, .col-head[data-path]:hover, .pane-head[data-path]:hover {
    filter: brightness(0.97);
  }
  body.dark .section-head[data-path]:hover, body.dark .col-head[data-path]:hover, body.dark .pane-head[data-path]:hover {
    filter: brightness(1.15);
  }

  /* ----------- inspector ----------- */
  .inspector {
    position: fixed;
    top: 50px; right: 0; bottom: 0;
    width: min(400px, 92vw);
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.18s ease-out;
    z-index: 80;
    box-shadow: -4px 0 16px rgba(0,0,0,0.08);
  }
  .inspector.show { transform: translateX(0); }
  .inspector .ins-head {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
  }
  .inspector .ins-head .crumb {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .inspector .ins-head .crumb .arrow { margin: 0 4px; opacity: 0.6; }
  .inspector .ins-head .crumb .tail  { color: var(--text); font-weight: 600; }
  .inspector .ins-head button.close {
    border: 0; background: transparent; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
    padding: 2px 6px; border-radius: 4px;
  }
  .inspector .ins-head button.close:hover { background: var(--hover); color: var(--text); }
  .inspector .ins-body {
    padding: 12px;
    overflow-y: auto;
    flex: 1;
    display: flex; flex-direction: column; gap: 10px;
  }
  .inspector .ins-foot {
    padding: 10px 12px;
    border-top: 1px solid var(--line);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .field label .kindtag {
    background: var(--badge-bg); color: var(--badge-fg);
    padding: 1px 6px; border-radius: 10px; font-size: 10px;
    font-weight: 500;
  }
  .field input, .field textarea {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    padding: 6px 8px;
    font-family: var(--mono); font-size: 12px;
    outline: none;
    resize: vertical;
    width: 100%;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .nested-list {
    display: flex; flex-direction: column; gap: 3px;
    border: 1px dashed var(--line-strong);
    border-radius: 5px;
    padding: 6px;
  }
  .nested-link {
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-family: var(--mono); font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .nested-link:hover { background: var(--hover); }
  .nested-link .nl-id { font-weight: 600; }
  .nested-link .nl-type { color: var(--muted); font-size: 11px; }
  .nested-link::before { content: '\2192'; color: var(--muted); }
  .ins-empty {
    color: var(--muted); font-style: italic;
    padding: 20px 12px; text-align: center; font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>betl pipeline viewer &middot; <span class="name" id="pkgName">&mdash;</span></h1>
  <span class="pathcrumb" id="pathCrumb"></span>
  <div class="spacer"></div>
  <button class="btn" id="browseBtn" title="Browse server files">browse&hellip;</button>
  <button class="btn" id="newBtn" title="Create a new YAML">new</button>
  <button class="btn" id="saveBtn" title="Save (Ctrl+S)">save</button>
  <button class="btn" id="validateBtn" title="Run betl validate on the loaded file">validate</button>
  <button class="btn" id="convertBtn" title="Convert a .dtsx via dtsx2yaml">convert dtsx&hellip;</button>
  <button class="btn" id="darkBtn" title="Toggle dark mode" aria-label="dark mode">&#9789;</button>
  <div class="toggle" id="viewModeToggle">
    <button data-viewmode="pipeline" class="active">Pipeline</button>
    <button data-viewmode="source">Source</button>
  </div>
  <div class="toggle" id="orientToggle">
    <button data-rankdir="TB" class="active">Portrait</button>
    <button data-rankdir="LR">Landscape</button>
  </div>
  <div class="toggle" id="portModeToggle">
    <button data-portmode="labels" class="active">Labels</button>
    <button data-portmode="ports">Ports</button>
  </div>
</header>

<main id="stage"></main>
<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">&mdash;</h3>
      <button class="close" id="modalClose" aria-label="close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<aside class="inspector" id="inspector">
  <div class="ins-head">
    <div class="crumb" id="inspectorCrumb"></div>
    <button class="close" id="inspectorClose" aria-label="close inspector">&times;</button>
  </div>
  <div class="ins-body" id="inspectorBody"></div>
  <div class="ins-foot">
    <button class="btn" id="inspectorDiscard">Discard</button>
    <button class="btn primary" id="inspectorApply">Apply</button>
  </div>
</aside>


<script>
'use strict';

/* -------------------------------------------------------------------------
 * Data model
 *
 * Pipeline = { name: string, steps: Step[] }
 * Step     = { id, type, after?: string[], steps?: Step[], kind, ...rest }
 *
 * `kind` is a coarse bucket for styling (container | dataflow | sql | map |
 * script | leaf), derived from `type`. The original `type` is preserved.
 * ----------------------------------------------------------------------- */

function classifyType(t) {
  if (!t) return 'leaf';
  const s = String(t).toLowerCase();
  if (s === 'container' || s === 'sequence' || s === 'foreach') return 'container';
  if (s === 'dataflow') return 'dataflow';
  if (s.startsWith('mssql') || s.startsWith('postgres') || s.startsWith('sql')) return 'sql';
  if (s === 'map' || s === 'filter' || s === 'sort' || s === 'union' ||
      s === 'multicast' || s === 'aggregate' || s === 'join' ||
      s === 'conditional_split' || s === 'pivot') return 'map';
  if (s.startsWith('dotnet') || s.includes('script')) return 'script';
  return 'leaf';
}

/* decorateStep mutates the parsed YAML object in place, adding `kind` for
 * styling. The returned pipeline view shares object identity with rawDoc,
 * so edits made through the inspector flow back to the doc for save. */
function decorateStep(s) {
  if (!s || typeof s !== 'object') return;
  s.kind = classifyType(s.type);
  if (Array.isArray(s.steps)) s.steps.forEach(decorateStep);
}

function buildPipelineView(doc) {
  if (!doc || typeof doc !== 'object') return { name: '(empty)', steps: [] };
  if (!Array.isArray(doc.pipeline)) doc.pipeline = [];
  doc.pipeline.forEach(decorateStep);
  return { name: doc.name || '(unnamed)', steps: doc.pipeline };
}

/* Recursively strip the UI-only `kind` field before serializing back. */
function stripKind(node) {
  if (Array.isArray(node)) { node.forEach(stripKind); return; }
  if (!node || typeof node !== 'object') return;
  delete node.kind;
  for (const k of Object.keys(node)) stripKind(node[k]);
}

/* -------------------------------------------------------------------------
 * Tiny HTML helpers
 * ----------------------------------------------------------------------- */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function describe(step) {
  const n = step.steps ? step.steps.length : 0;
  const after = step.after && step.after.length
    ? ` &middot; ← ${step.after.map(esc).join(', ')}`
    : '';
  return `${n} ${n === 1 ? 'child' : 'children'}${after}`;
}

/* Collect the from-specs that feed this step. Each spec is the raw
 * string from YAML: either a bare step id ("read") or a port ref
 * ("route:new"). De-duped on the full spec so two refs to the exact
 * same port collapse, while "route:new" and "route:changed" stay
 * separate (they're different output streams). */
function collectFromIds(from) {
  const items = Array.isArray(from) ? from : (from == null ? [] : [from]);
  const seen = new Set();
  const out = [];
  for (const x of items) {
    if (typeof x !== 'string' || !x) continue;
    if (!seen.has(x)) { seen.add(x); out.push(x); }
  }
  return out;
}

function parseFromSpec(spec) {
  const i = spec.indexOf(':');
  return i < 0
    ? { srcId: spec, port: '' }
    : { srcId: spec.slice(0, i), port: spec.slice(i + 1) };
}

function stepCard(step, path, portsByStep) {
  const kind = step.kind || 'leaf';
  const innerCount = step.steps && step.steps.length
    ? `<span class="badge">${step.steps.length} steps</span>`
    : '';
  const after = step.after && step.after.length
    ? `<span class="after">${step.after.map(esc).join(', ')}</span>`
    : '';
  const pathAttr = path != null ? ` data-path="${esc(path)}"` : '';
  const idAttr = step.id != null ? ` data-id="${esc(step.id)}"` : '';
  const fromIds = collectFromIds(step.from);
  const fromAttr = fromIds.length
    ? ` data-from="${esc(fromIds.join(','))}"`
    : '';
  // In ports mode, a multi-output step renders as one card with an
  // internal divider: the body section holds the usual id/type/after
  // content, and each output port gets a partitioned cell on the
  // outflow face. The card is still a single dagre node — port-anchor
  // snapping happens after layout in applyFlowLayout().
  const ports = portsByStep && step.id ? portsByStep[step.id] : null;
  if (ports && ports.size && state.portMode === 'ports') {
    const portCells = [...ports].map(
      (p) => `<div class="port-cell" data-port="${esc(p)}">${esc(p)}</div>`
    ).join('');
    return `<div class="step has-ports k-${kind}"${pathAttr}${idAttr}${fromAttr} role="button" tabindex="0">
      <div class="step-body">
        <span class="id">${esc(step.id)}</span>
        <span class="ttype">${esc(step.type || '')}</span>
        ${after}
        ${innerCount}
      </div>
      <div class="step-ports">${portCells}</div>
    </div>`;
  }
  return `<div class="step k-${kind}"${pathAttr}${idAttr}${fromAttr} role="button" tabindex="0">
    <span class="id">${esc(step.id)}</span>
    <span class="ttype">${esc(step.type || '')}</span>
    ${after}
    ${innerCount}
  </div>`;
}

/* Scan a sibling list and return a map { stepId -> Set<port> } of which
 * steps are referenced by downstream consumers via port refs. Used by
 * the Flow template to decide which cards get partitioned. */
function computePortsByStep(steps) {
  const out = {};
  if (!Array.isArray(steps)) return out;
  for (const c of steps) {
    for (const spec of collectFromIds(c.from)) {
      const { srcId, port } = parseFromSpec(spec);
      if (!port) continue;
      if (!out[srcId]) out[srcId] = new Set();
      out[srcId].add(port);
    }
  }
  return out;
}

/* -------------------------------------------------------------------------
 * Flow template: each top-level pipeline step becomes a section with a
 * dagre-laid-out canvas of its children. applyFlowLayout() does the
 * geometry pass after the DOM is in place.
 * ----------------------------------------------------------------------- */

const flowTemplate = {
  render(pipeline) {
    const orient = state.rankdir === 'LR' ? 'landscape' : 'portrait';
    return `<div class="v-flow ${orient}">
      ${pipeline.steps.map((s, i) => this.section(s, i)).join('')}
    </div>`;
  },
  section(step, i) {
    const hasChildren = step.steps && step.steps.length;
    const portsByStep = hasChildren ? computePortsByStep(step.steps) : {};
    const body = hasChildren
      ? `<div class="flow-canvas">${step.steps.map((c, j) => stepCard(c, `${i},${j}`, portsByStep)).join('')}</div>`
      : `<div class="empty">no children</div>`;
    return `<section class="flow-section">
      <div class="flow-head k-${step.kind || 'leaf'}" data-path="${i}" role="button" tabindex="0">
        <span class="id">${esc(step.id)}</span>
        <span class="meta">${esc(step.type || '')}</span>
        <span class="meta">${(step.steps || []).length} children</span>
      </div>
      ${body}
    </section>`;
  },
};

/* -------------------------------------------------------------------------
 * App state + wiring
 * ----------------------------------------------------------------------- */

const state = {
  pipeline: { name: '(none)', steps: [] },
  rawDoc: null,          // full parsed YAML doc; pipeline.steps share identity
  rankdir: 'TB',         // 'TB' = portrait, 'LR' = landscape (dagre rankdir)
  portMode: 'labels',    // 'labels' = port name on the arrow; 'ports' = partition inside source card
  viewMode: 'pipeline',  // 'pipeline' = visual layout; 'source' = raw YAML textarea
  selectedPath: null,    // comma-joined indices of the inspected step
  currentPath: null,     // server-relative path of the loaded file
  currentText: '',       // raw YAML text last loaded/saved (kept in sync in source mode)
  dirty: false,          // edits since last save
  hasComments: false,
  tools: { betl: null, dtsx2yaml: null },  // populated by /api/tools on boot
};

const stage     = document.getElementById('stage');
const pkgName   = document.getElementById('pkgName');
const pathCrumb = document.getElementById('pathCrumb');

function render() {
  pkgName.textContent = state.pipeline.name;
  const tag = state.currentPath ? '@ ' + state.currentPath : '';
  pathCrumb.innerHTML = tag + (state.dirty ? ' <span class="dirty"></span>' : '');
  syncHeaderForMode();
  if (state.viewMode === 'source') {
    renderSource();
    return;
  }
  stage.innerHTML = renderMetaPanel() + flowTemplate.render(state.pipeline);
  if (state.selectedPath != null) {
    stage.querySelectorAll(`[data-path="${CSS.escape(state.selectedPath)}"]`)
      .forEach(el => el.classList.add('selected'));
  }
  // dagre runs after the DOM is in place so card sizes can be measured.
  requestAnimationFrame(applyFlowLayout);
}

/* Render the metadata strip above the pipeline canvas: top-level YAML
 * sections that aren't visible in the flow view. Currently:
 *   - connections (one chip per entry, color-coded by type)
 *   - parameters  (one chip per entry, color-coded by type)
 * Each chip carries a data-path so the existing inspector click handler
 * opens it for edit. */
function renderMetaPanel() {
  const doc = state.rawDoc;
  if (!doc) return '';
  const conns = (doc.connections && typeof doc.connections === 'object')
    ? doc.connections : {};
  const params = (doc.parameters && typeof doc.parameters === 'object')
    ? doc.parameters : {};
  const cKeys = Object.keys(conns);
  const pKeys = Object.keys(params);
  if (cKeys.length === 0 && pKeys.length === 0) return '';

  function chip(name, kindClass, type, path) {
    return `<div class="meta-chip ${kindClass}" data-path="${esc(path)}"
              role="button" tabindex="0">
      <span class="chip-id">${esc(name)}</span>
      ${type ? `<span class="chip-type">${esc(type)}</span>` : ''}
    </div>`;
  }

  const connsHtml = cKeys.length
    ? cKeys.map((k) => {
        const v = conns[k] || {};
        const t = typeof v === 'object' ? (v.type || '') : '';
        return chip(k, t ? 'k-' + String(t).toLowerCase() : '', t, 'conn:' + k);
      }).join('')
    : '<div class="meta-empty">(none)</div>';

  const paramsHtml = pKeys.length
    ? pKeys.map((k) => {
        const v = params[k] || {};
        const t = typeof v === 'object' ? (v.type || '') : '';
        return chip(k, t ? 'k-param-' + String(t).toLowerCase() : '', t, 'param:' + k);
      }).join('')
    : '<div class="meta-empty">(none)</div>';

  return `<div class="meta-panel">
    <div class="meta-section">
      <div class="meta-head">connections <span class="count">${cKeys.length}</span></div>
      <div class="meta-chips">${connsHtml}</div>
    </div>
    <div class="meta-section">
      <div class="meta-head">parameters <span class="count">${pKeys.length}</span></div>
      <div class="meta-chips">${paramsHtml}</div>
    </div>
  </div>`;
}

/* Source mode replaces the visual layout with a full-height textarea
 * bound to state.currentText. Edits are propagated live so a switch
 * back to pipeline mode (or a save) sees the latest text. */
function renderSource() {
  stage.innerHTML = `<div class="src-pane">
    <textarea id="srcEditor" spellcheck="false" wrap="off"></textarea>
  </div>`;
  const ta = document.getElementById('srcEditor');
  ta.value = state.currentText || '';
  ta.addEventListener('input', () => {
    state.currentText = ta.value;
    state.dirty = true;
    pathCrumb.innerHTML = (state.currentPath ? '@ ' + state.currentPath : '')
      + ' <span class="dirty"></span>';
  });
}

/* Hide the pipeline-only header controls when source mode is active. */
function syncHeaderForMode() {
  const isPipeline = state.viewMode === 'pipeline';
  document.getElementById('orientToggle').style.display = isPipeline ? '' : 'none';
  document.getElementById('portModeToggle').style.display = isPipeline ? '' : 'none';
}

const SVG_NS = 'http://www.w3.org/2000/svg';

let _redrawTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(_redrawTimer);
  _redrawTimer = setTimeout(applyFlowLayout, 80);
});

/* -------------------------------------------------------------------------
 * Flow layout: dagre computes positions for cards + edge waypoints; we
 * absolute-position the existing card HTML and draw SVG polylines along
 * dagre's routed paths. Cards keep their click-to-inspect, kind colors,
 * and badge content unchanged — dagre only owns geometry, not styling.
 * ----------------------------------------------------------------------- */

function applyFlowLayout() {
  if (typeof dagre === 'undefined') {
    console.warn('dagre not loaded; flow layout unavailable');
    return;
  }
  const canvases = stage.querySelectorAll('.v-flow .flow-canvas');
  for (const canvas of canvases) {
    canvas.querySelector(':scope > svg.conns')?.remove();

    const stepEls = Array.from(canvas.querySelectorAll(':scope > .step'));
    if (!stepEls.length) continue;

    // Reset inline geometry so getBoundingClientRect returns natural
    // inline-flex sizes before dagre.layout() consumes them.
    for (const el of stepEls) {
      el.style.position = '';
      el.style.left = '';
      el.style.top = '';
      el.style.width = '';
      el.style.height = '';
    }

    // multigraph: true so two distinct ports from the same source to
    // the same target are kept as separate edges (unique edge name).
    const G = new dagre.graphlib.Graph({ multigraph: true });
    G.setGraph({ rankdir: state.rankdir, nodesep: 24, ranksep: 36, marginx: 14, marginy: 14 });
    G.setDefaultEdgeLabel(() => ({}));

    for (const el of stepEls) {
      if (!el.dataset.id) continue;
      const r = el.getBoundingClientRect();
      G.setNode(el.dataset.id, {
        width: Math.max(140, r.width),
        height: Math.max(30, r.height),
        el,
      });
    }

    for (const el of stepEls) {
      if (!el.dataset.id || !el.dataset.from) continue;
      const tgtId = el.dataset.id;
      for (const spec of el.dataset.from.split(',')) {
        const { srcId, port } = parseFromSpec(spec);
        if (!G.hasNode(srcId) || srcId === tgtId) continue;
        const wantLabel = port && state.portMode === 'labels';
        const opts = wantLabel
          ? { label: port, width: port.length * 7 + 8, height: 16, labelpos: 'c', port }
          : (port ? { port } : {});
        const name = port ? `${srcId}:${port}->${tgtId}` : `${srcId}->${tgtId}`;
        G.setEdge(srcId, tgtId, opts, name);
      }
    }

    dagre.layout(G);

    const gb = G.graph();
    canvas.style.width = (gb.width || 100) + 'px';
    canvas.style.height = (gb.height || 50) + 'px';

    for (const id of G.nodes()) {
      const n = G.node(id);
      if (!n.el) continue;
      n.el.style.position = 'absolute';
      n.el.style.left = (n.x - n.width / 2) + 'px';
      n.el.style.top = (n.y - n.height / 2) + 'px';
      n.el.style.width = n.width + 'px';
    }

    // Untangle: reorder port cells so the perpendicular axis (x for
    // portrait, y for landscape) of each port's downstream target(s)
    // is monotonic across the cells. Card position is unchanged — we
    // only rearrange the cell DOM siblings, then re-measure anchors.
    const horizontalFlow = state.rankdir === 'LR';
    if (state.portMode === 'ports') {
      for (const card of canvas.querySelectorAll(':scope > .step.has-ports')) {
        const sid = card.dataset.id;
        const host = card.querySelector('.step-ports');
        if (!sid || !host) continue;
        const targetCoord = {};
        for (const e of G.edges()) {
          if (e.v !== sid) continue;
          const edge = G.edge(e);
          if (!edge.port) continue;
          const tgt = G.node(e.w);
          if (!tgt) continue;
          (targetCoord[edge.port] ||= []).push(horizontalFlow ? tgt.y : tgt.x);
        }
        const meanOf = (p) => {
          const xs = targetCoord[p];
          if (!xs || !xs.length) return Number.POSITIVE_INFINITY;
          return xs.reduce((s, x) => s + x, 0) / xs.length;
        };
        const cells = Array.from(host.children);
        cells.sort((a, b) => meanOf(a.dataset.port) - meanOf(b.dataset.port));
        for (const c of cells) host.appendChild(c);
      }
    }

    // After cards are positioned (and port cells optionally re-sorted),
    // measure each port cell's center on its outflow face. Coordinates
    // are content-space (canvas-local), matching dagre's waypoints.
    const portAnchor = {};
    if (state.portMode === 'ports') {
      for (const card of canvas.querySelectorAll(':scope > .step.has-ports')) {
        const sid = card.dataset.id;
        if (!sid) continue;
        for (const cell of card.querySelectorAll('.port-cell')) {
          const port = cell.dataset.port;
          if (!port) continue;
          let ox = 0, oy = 0, cur = cell;
          while (cur && cur !== canvas) {
            ox += cur.offsetLeft;
            oy += cur.offsetTop;
            cur = cur.offsetParent;
          }
          const w = cell.offsetWidth, h = cell.offsetHeight;
          portAnchor[sid + '::' + port] = horizontalFlow
            ? { x: ox + w, y: oy + h / 2 }
            : { x: ox + w / 2, y: oy + h };
        }
      }
    }

    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'conns');
    svg.setAttribute('width', String(gb.width || 100));
    svg.setAttribute('height', String(gb.height || 50));

    for (const e of G.edges()) {
      const edge = G.edge(e);
      const pts = edge.points;
      if (!pts || pts.length < 2) continue;

      // In ports mode, snap the edge's start point to the source
      // card's port cell. Dagre routed from the card center; the
      // remaining waypoints are still valid because the cell sits
      // on the same outflow face as the original exit point.
      if (state.portMode === 'ports' && edge.port) {
        const a = portAnchor[e.v + '::' + edge.port];
        if (a) pts[0] = { x: a.x, y: a.y };
      }

      const d = 'M ' + pts.map((p) => `${p.x} ${p.y}`).join(' L ');
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', d);
      svg.appendChild(path);

      const pE = pts[pts.length - 1];
      const pP = pts[pts.length - 2];
      const ang = Math.atan2(pE.y - pP.y, pE.x - pP.x);
      const ah = 6, al = 9;
      const baseX = pE.x - Math.cos(ang) * al;
      const baseY = pE.y - Math.sin(ang) * al;
      const lx = baseX + Math.cos(ang + Math.PI / 2) * ah;
      const ly = baseY + Math.sin(ang + Math.PI / 2) * ah;
      const rx = baseX - Math.cos(ang + Math.PI / 2) * ah;
      const ry = baseY - Math.sin(ang + Math.PI / 2) * ah;
      const head = document.createElementNS(SVG_NS, 'path');
      head.setAttribute('class', 'arrow-head');
      head.setAttribute('d', `M ${pE.x} ${pE.y} L ${lx} ${ly} L ${rx} ${ry} Z`);
      svg.appendChild(head);

      // Mid-edge label only used in labels mode (ports mode shows the
      // port names inside the source card's partitioned cells).
      if (edge.label && edge.x != null) {
        const bgW = edge.width || (edge.label.length * 7 + 8);
        const bgH = edge.height || 16;
        const bg = document.createElementNS(SVG_NS, 'rect');
        bg.setAttribute('class', 'edge-label-bg');
        bg.setAttribute('x', edge.x - bgW / 2);
        bg.setAttribute('y', edge.y - bgH / 2);
        bg.setAttribute('width', bgW);
        bg.setAttribute('height', bgH);
        bg.setAttribute('rx', 3);
        svg.appendChild(bg);

        const text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('class', 'edge-label');
        text.setAttribute('x', edge.x);
        text.setAttribute('y', edge.y);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.textContent = edge.label;
        svg.appendChild(text);
      }
    }
    canvas.appendChild(svg);
  }
}

/* step click → inspector */
stage.addEventListener('click', (e) => {
  const el = e.target.closest('[data-path]');
  if (!el || !stage.contains(el)) return;
  openInspector(el.dataset.path);
});
stage.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('[data-path]');
  if (!el) return;
  e.preventDefault();
  openInspector(el.dataset.path);
});

/* Path forms:
 *   "0,1,2"      — pipeline step (comma-joined indices, legacy)
 *   "conn:NAME"  — connection definition (state.rawDoc.connections[NAME])
 *   "param:NAME" — parameter definition (state.rawDoc.parameters[NAME])
 *
 * nodeAt(path) returns the underlying object (mutable; edits flow back
 * to state.rawDoc). nodeKind(path) reports the path's section so the
 * inspector can pick the right field-ordering / breadcrumb. */
function nodeKind(path) {
  if (!path) return null;
  const s = String(path);
  if (s.startsWith('conn:'))  return 'conn';
  if (s.startsWith('param:')) return 'param';
  return 'pipeline';
}

function nodeAt(path) {
  const kind = nodeKind(path);
  if (!kind) return null;
  const doc = state.rawDoc;
  if (!doc) return null;
  if (kind === 'conn') {
    const name = String(path).slice('conn:'.length);
    return (doc.connections && typeof doc.connections === 'object') ? doc.connections[name] : null;
  }
  if (kind === 'param') {
    const name = String(path).slice('param:'.length);
    return (doc.parameters && typeof doc.parameters === 'object') ? doc.parameters[name] : null;
  }
  const parts = String(path).split(',').map(Number);
  let arr = doc.pipeline;
  let cur = null;
  for (const idx of parts) {
    if (!Array.isArray(arr) || idx < 0 || idx >= arr.length) return null;
    cur = arr[idx];
    arr = cur && cur.steps;
  }
  return cur;
}

/* stepAt kept as a thin alias for the existing call sites that
 * specifically expect a pipeline-step (e.g. drill-down adds `,N` to
 * the path, which only makes sense for the pipeline form). */
function stepAt(path) {
  if (nodeKind(path) !== 'pipeline') return null;
  return nodeAt(path);
}

function loadYamlText(text, sourceName, serverPath) {
  let doc;
  try {
    doc = jsyaml.load(text);
  } catch (e) {
    // Keep the failing source on hand so the user can open Source mode
    // and fix it without re-loading the file.
    state.currentText = text;
    state.currentPath = serverPath || null;
    showParseError(serverPath || sourceName || '(input)', text, e);
    return;
  }
  state.rawDoc = (doc && typeof doc === 'object') ? doc : {};
  state.pipeline = buildPipelineView(state.rawDoc);
  state.currentText = text;
  state.currentPath = serverPath || null;
  state.dirty = false;
  state.selectedPath = null;
  state.hasComments = /^\s*#/m.test(text);
  if (sourceName && !state.pipeline.name) {
    state.pipeline.name = sourceName;
    state.rawDoc.name = sourceName;
  }
  closeInspector();
  render();
  if (state.hasComments) {
    toast('Note: comments in this file will be lost on save', true);
  }
}

/* Inline parse-error panel for whole-file load failures. The previous
 * toast-only approach was easy to miss; this leaves the error on the
 * main stage with line/column and a code snippet around the bad spot
 * until the next successful load. */
function showParseError(label, text, e) {
  state.pipeline = { name: '(parse error)', steps: [] };
  state.rawDoc = null;
  state.dirty = false;
  state.selectedPath = null;
  // Keep state.currentText and state.currentPath so the user can flip
  // to Source mode and fix the broken YAML in place.
  closeInspector();

  pkgName.textContent = '(parse error)';
  pathCrumb.innerHTML = '@ ' + esc(label);

  const mark = e && e.mark ? e.mark : null;
  const line = mark && typeof mark.line === 'number' ? mark.line + 1 : null;
  const col  = mark && typeof mark.column === 'number' ? mark.column + 1 : null;
  const where = line != null
    ? `at line ${line}` + (col != null ? `, column ${col}` : '')
    : '';
  const reason = (e && (e.reason || e.message)) || String(e);

  // Browser console first, then best-effort POST to the server so the
  // error also lands in the terminal hosting the viewer.
  console.error('[betl-yaml-ui] YAML parse error in', label, where || '', e);
  try {
    fetch('/api/log', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: `YAML parse error in ${label}` + (where ? ' ' + where : '') + `: ${reason}`,
      keepalive: true,
    }).catch(() => {});
  } catch (_) {}

  let snippet = '';
  if (mark && typeof mark.snippet === 'function') {
    snippet = mark.snippet(2, 120);  // 2-space prefix, 120-char width
  } else if (line != null) {
    const lines = text.split('\n');
    const lo = Math.max(0, line - 5);
    const hi = Math.min(lines.length, line + 4);
    const pad = String(hi).length;
    snippet = lines.slice(lo, hi).map((s, i) => {
      const n = lo + i + 1;
      const marker = n === line ? '>' : ' ';
      return `${marker} ${String(n).padStart(pad)} | ${s}`;
    }).join('\n');
  }

  stage.innerHTML = `<div class="parse-error">
    <div class="pe-head">YAML parse error in <code>${esc(label)}</code></div>
    ${where ? `<div class="pe-where">${esc(where)}</div>` : ''}
    <div class="pe-reason">${esc(reason)}</div>
    ${snippet ? `<pre class="pe-snippet">${esc(snippet)}</pre>` : ''}
    <div class="pe-foot">
      <button class="btn" id="parseErrorDismiss">Dismiss</button>
    </div>
  </div>`;
  document.getElementById('parseErrorDismiss').addEventListener('click', dismissParseError);
}

function dismissParseError() {
  pkgName.textContent = '—';
  pathCrumb.innerHTML = '';
  stage.innerHTML = `
    <div style="text-align:center; color:var(--muted); padding:60px 20px; font-family:var(--mono); font-size:13px;">
      no pipeline loaded
      <div style="margin-top:8px; font-size:12px;">use <b>browse&hellip;</b> to pick a YAML file</div>
    </div>`;
}

/* ---------- inspector ---------- */
const inspectorEl    = document.getElementById('inspector');
const inspectorBody  = document.getElementById('inspectorBody');
const inspectorCrumb = document.getElementById('inspectorCrumb');

const RESERVED_KEYS = new Set(['id', 'type', 'after', 'steps', 'kind']);

function openInspector(path) {
  const node = nodeAt(path);
  if (!node) return;
  state.selectedPath = String(path);
  inspectorEl.classList.add('show');
  renderInspector();
  render();   /* refresh to highlight the selected card / chip */
}

function closeInspector() {
  state.selectedPath = null;
  inspectorEl.classList.remove('show');
  inspectorBody.innerHTML = '';
  inspectorCrumb.innerHTML = '';
}

function pathCrumbHtml(path) {
  const kind = nodeKind(path);
  if (kind === 'conn') {
    const name = String(path).slice('conn:'.length);
    return '<span class="arrow">connections</span><span class="arrow">/</span>'
         + '<span class="tail">' + esc(name) + '</span>';
  }
  if (kind === 'param') {
    const name = String(path).slice('param:'.length);
    return '<span class="arrow">parameters</span><span class="arrow">/</span>'
         + '<span class="tail">' + esc(name) + '</span>';
  }
  const parts = String(path).split(',').map(Number);
  const segs = [];
  let arr = state.rawDoc && state.rawDoc.pipeline;
  let cur = null;
  for (const idx of parts) {
    if (!Array.isArray(arr)) break;
    cur = arr[idx];
    if (!cur) break;
    segs.push(esc(cur.id || '?'));
    arr = cur.steps;
  }
  const tail = segs.pop() || '?';
  const head = segs.length ? segs.join('<span class="arrow">/</span>') + '<span class="arrow">/</span>' : '';
  return head + '<span class="tail">' + tail + '</span>';
}

/* Keys whose textareas should grow an "Expand…" affordance that pops
 * a CodeMirror SQL editor. Matched case-insensitively. */
const SQL_KEYS = new Set(['sql', 'query']);
function isSqlKey(k) { return SQL_KEYS.has(String(k).toLowerCase()); }

function fieldEditor(key, val, opts) {
  opts = opts || {};
  const label = esc(key);
  const id = 'fld_' + key.replace(/[^\w]/g, '_');
  if (Array.isArray(val) && val.every(v => typeof v === 'string')) {
    return `<div class="field">
      <label for="${id}">${label} <span class="kindtag">list</span></label>
      <input id="${id}" data-key="${esc(key)}" data-kind="strlist" value="${esc(val.join(', '))}" spellcheck="false">
    </div>`;
  }
  if (val == null || typeof val === 'string' || typeof val === 'number' || typeof val === 'boolean') {
    const str = String(val == null ? '' : val);
    const tag = val == null ? 'unset' : typeof val;
    const expand = isSqlKey(key)
      ? `<button type="button" class="expand-sql" data-sql-for="${id}">Expand&hellip;</button>`
      : '';
    if (str.includes('\n') || str.length > 60 || isSqlKey(key)) {
      const rows = Math.min(12, Math.max(3, str.split('\n').length + 1));
      return `<div class="field">
        <label for="${id}">${label} <span class="kindtag">${tag}</span>${expand}</label>
        <textarea id="${id}" data-key="${esc(key)}" data-kind="text" rows="${rows}" spellcheck="false">${esc(str)}</textarea>
      </div>`;
    }
    return `<div class="field">
      <label for="${id}">${label} <span class="kindtag">${tag}</span></label>
      <input id="${id}" data-key="${esc(key)}" data-kind="text" value="${esc(str)}" spellcheck="false">
    </div>`;
  }
  /* complex value: YAML textarea */
  let dumped = '';
  try { dumped = jsyaml.dump(val, { lineWidth: 100, noRefs: true }).trimEnd(); } catch (_) {}
  const rows = Math.min(14, Math.max(3, dumped.split('\n').length + 1));
  return `<div class="field">
    <label for="${id}">${label} <span class="kindtag">yaml</span></label>
    <textarea id="${id}" data-key="${esc(key)}" data-kind="yaml" rows="${rows}" spellcheck="false">${esc(dumped)}</textarea>
  </div>`;
}

function renderInspector() {
  const node = nodeAt(state.selectedPath);
  if (!node) { closeInspector(); return; }
  const kind = nodeKind(state.selectedPath);
  inspectorCrumb.innerHTML = pathCrumbHtml(state.selectedPath);

  /* Per-node-kind field ordering: pipeline steps lead with id/type/after,
   * connections lead with type/dsn, parameters lead with type/default. */
  const all = Object.keys(node).filter(k => k !== 'kind');
  let front;
  if (kind === 'conn') {
    front = ['type', 'dsn'].filter(k => k in node);
  } else if (kind === 'param') {
    front = ['type', 'default', 'required', 'doc'].filter(k => k in node);
  } else {
    front = ['id', 'type', 'after'].filter(k => k in node);
  }
  const extras = all.filter(k => !RESERVED_KEYS.has(k) && !front.includes(k)).sort();
  const hasSteps = kind === 'pipeline'
    && Array.isArray(node.steps) && node.steps.length > 0;

  const fieldsHtml = [...front, ...extras].map(k => fieldEditor(k, node[k])).join('');

  const nestedHtml = hasSteps
    ? `<div class="field">
         <label>steps <span class="kindtag">${node.steps.length} nested</span></label>
         <div class="nested-list">
           ${node.steps.map((s, j) => `
             <div class="nested-link" data-rel="${j}">
               <span class="nl-id">${esc(s.id || '?')}</span>
               <span class="nl-type">${esc(s.type || '')}</span>
             </div>`).join('')}
         </div>
       </div>`
    : '';

  inspectorBody.innerHTML = fieldsHtml + nestedHtml;

  /* drill-down: clicking a nested step opens it in the inspector */
  inspectorBody.querySelectorAll('.nested-link').forEach((el) => {
    el.addEventListener('click', () => {
      const rel = parseInt(el.dataset.rel, 10);
      openInspector(state.selectedPath + ',' + rel);
    });
  });

  /* "Expand…" on SQL-bearing fields → CodeMirror overlay. */
  inspectorBody.querySelectorAll('.expand-sql').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const ta = document.getElementById(btn.dataset.sqlFor);
      if (!ta) return;
      openSqlEditor(ta, ta.dataset.key || 'sql');
    });
  });
}

/* Pop a full-screen CodeMirror SQL editor backed by the given textarea.
 * Cancel discards; Apply writes back and fires the textarea's input
 * event so the inspector's dirty-tracking picks it up. Esc cancels,
 * Ctrl/Cmd+Enter applies. */
function openSqlEditor(textarea, keyLabel) {
  if (typeof CodeMirror === 'undefined') {
    toast('SQL editor unavailable (CodeMirror failed to load)', true);
    return;
  }
  const overlay = document.createElement('div');
  overlay.className = 'sql-modal show';
  overlay.innerHTML = `
    <div class="sql-modal-card">
      <div class="sql-modal-head">
        <h3>SQL editor</h3>
        <span class="crumb">${esc(keyLabel)}</span>
        <button class="close" aria-label="close">&times;</button>
      </div>
      <div class="sql-modal-body"></div>
      <div class="sql-modal-foot">
        <span class="hint">Esc cancels &middot; Ctrl/Cmd&#8209;Enter applies</span>
        <button class="btn cancel">Cancel</button>
        <button class="btn primary apply">Apply</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const isDark = document.body.classList.contains('dark');
  const cm = CodeMirror(overlay.querySelector('.sql-modal-body'), {
    value: textarea.value,
    mode: 'text/x-sql',
    lineNumbers: true,
    lineWrapping: true,
    indentUnit: 2,
    theme: isDark ? 'material-darker' : 'idea',
    autofocus: true,
  });
  // CodeMirror sizes itself from the container at construction; flex
  // children settle on a later layout tick so force a refresh.
  setTimeout(() => cm.refresh(), 0);

  const close = () => {
    document.removeEventListener('keydown', onKey, true);
    overlay.remove();
  };
  const apply = () => {
    textarea.value = cm.getValue();
    textarea.dispatchEvent(new Event('input', { bubbles: true }));
    close();
  };
  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault(); apply();
    }
  }

  overlay.querySelector('.close').addEventListener('click', close);
  overlay.querySelector('.cancel').addEventListener('click', close);
  overlay.querySelector('.apply').addEventListener('click', apply);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKey, true);
}

function applyInspector() {
  const step = nodeAt(state.selectedPath);
  if (!step) return;
  const inputs = inspectorBody.querySelectorAll('[data-key]');
  const updates = [];
  for (const inp of inputs) {
    const k = inp.dataset.key;
    const kind = inp.dataset.kind;
    const v = inp.value;
    try {
      if (kind === 'strlist') {
        const arr = v.split(',').map(x => x.trim()).filter(Boolean);
        updates.push([k, arr.length ? arr : undefined]);
      } else if (kind === 'yaml') {
        if (v.trim() === '') updates.push([k, undefined]);
        else updates.push([k, jsyaml.load(v)]);
      } else {
        updates.push([k, v === '' ? undefined : v]);
      }
    } catch (e) {
      toast(`Apply failed at ${k}: ${e.message}`, true);
      return;
    }
  }
  let changed = false;
  for (const [k, v] of updates) {
    const prev = step[k];
    if (v === undefined) {
      if (k in step) { delete step[k]; changed = true; }
    } else {
      if (JSON.stringify(prev) !== JSON.stringify(v)) { step[k] = v; changed = true; }
    }
  }
  if (changed) {
    /* decorate is only meaningful for pipeline steps; connections /
     * parameters have no `kind` field. */
    if (nodeKind(state.selectedPath) === 'pipeline') decorateStep(step);
    state.dirty = true;
    render();
    renderInspector();
    toast('Applied');
  } else {
    toast('No changes');
  }
}

document.getElementById('inspectorClose').addEventListener('click', closeInspector);
document.getElementById('inspectorApply').addEventListener('click', applyInspector);
document.getElementById('inspectorDiscard').addEventListener('click', () => {
  renderInspector();   /* re-render = revert input values to current model */
  toast('Discarded');
});

/* ---------- server: browse / load / save / new ---------- */
function dirnameOf(p) {
  if (!p) return '';
  const i = p.lastIndexOf('/');
  return i < 0 ? '' : p.slice(0, i);
}

async function openBrowser(path) {
  path = path || '';
  let j;
  try {
    const r = await fetch('/api/list?path=' + encodeURIComponent(path));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    j = await r.json();
  } catch (e) {
    toast('Browse failed: ' + e.message, true);
    return;
  }
  const upPath = path ? dirnameOf(path) : null;
  const upRow = upPath !== null
    ? `<div class="entry" data-kind="dir" data-path="${esc(upPath)}">
         <span class="icon">&#x21B0;</span><span class="name">..</span>
       </div>`
    : '';
  const dirRows = j.dirs.map((d) =>
    `<div class="entry" data-kind="dir" data-path="${esc(d.path)}">
       <span class="icon">&#128193;</span><span class="name">${esc(d.name)}</span>
     </div>`
  ).join('');
  const fileRows = j.files.map((f) =>
    `<div class="entry" data-kind="file" data-path="${esc(f.path)}">
       <span class="icon">&#128462;</span><span class="name">${esc(f.name)}</span>
       <span class="size">${f.size} B</span>
     </div>`
  ).join('');
  const where = j.path ? j.path : '<root>';
  const body = `
    <div class="bcrumb"><span class="root">root</span> / ${esc(where)}</div>
    <div class="entries">${upRow}${dirRows}${fileRows}
      ${(j.dirs.length + j.files.length === 0) ? '<div class="entry" style="color:var(--muted)">(empty)</div>' : ''}
    </div>`;
  openModal('Browse', body, `<button class="btn" onclick="closeModal()">Cancel</button>`);
  modalBody.querySelectorAll('.entry[data-kind="dir"]').forEach((el) =>
    el.addEventListener('click', () => openBrowser(el.dataset.path))
  );
  modalBody.querySelectorAll('.entry[data-kind="file"]').forEach((el) =>
    el.addEventListener('click', () => loadServerFile(el.dataset.path))
  );
}

async function loadServerFile(path) {
  try {
    const r = await fetch('/api/file?path=' + encodeURIComponent(path));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    closeModal();
    loadYamlText(text, path.split('/').pop().replace(/\.[^.]+$/, ''), path);
    toast('Loaded ' + path);
  } catch (e) {
    toast('Load failed: ' + e.message, true);
  }
}

async function writeServerFile(path, text) {
  const r = await fetch('/api/file?path=' + encodeURIComponent(path), {
    method: 'PUT',
    headers: { 'Content-Type': 'text/yaml' },
    body: text,
  });
  if (!r.ok) {
    const err = await r.text().catch(() => '');
    throw new Error('HTTP ' + r.status + (err ? ': ' + err : ''));
  }
  return r.json();
}

function openSaveAs(prefill) {
  if (state.viewMode !== 'source' && state.dirty) {
    state.currentText = serializeRawDoc();
  }
  const initial = prefill || state.currentPath || 'untitled.yml';
  const body = `
    <div class="saveform">
      <label for="savePath">Save to (relative to server root):</label>
      <input id="savePath" type="text" value="${esc(initial)}" autocomplete="off" spellcheck="false">
      <div class="hint">Must end in <code>.yml</code> or <code>.yaml</code>. Parent dirs are created.</div>
      <div class="hint err" id="saveErr" style="display:none"></div>
    </div>`;
  openModal('Save as', body, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn primary" id="saveConfirm">Save</button>
  `);
  const input = document.getElementById('savePath');
  const errEl = document.getElementById('saveErr');
  const doSave = async () => {
    const p = input.value.trim();
    if (!/\.(ya?ml)$/i.test(p)) {
      errEl.style.display = 'block';
      errEl.textContent = 'path must end in .yml or .yaml';
      return;
    }
    try {
      await writeServerFile(p, state.currentText);
      state.currentPath = p;
      state.dirty = false;
      closeModal();
      render();
      toast('Saved ' + p);
    } catch (e) {
      errEl.style.display = 'block';
      errEl.textContent = e.message;
    }
  };
  document.getElementById('saveConfirm').addEventListener('click', doSave);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSave(); });
  input.focus();
  input.select();
}

function serializeRawDoc() {
  /* deep-clone so we can strip UI-only `kind` fields without mutating state */
  const clone = JSON.parse(JSON.stringify(state.rawDoc || {}));
  stripKind(clone);
  return jsyaml.dump(clone, { lineWidth: 120, noRefs: true });
}

async function saveCurrent() {
  if (!state.rawDoc && !state.currentText) { toast('Nothing loaded', true); return; }
  if (state.viewMode !== 'source' && state.dirty) {
    state.currentText = serializeRawDoc();
  }
  if (!state.currentPath) { openSaveAs(); return; }
  try {
    await writeServerFile(state.currentPath, state.currentText);
    state.dirty = false;
    render();
    toast('Saved ' + state.currentPath);
  } catch (e) {
    toast('Save failed: ' + e.message, true);
  }
}

function newPipeline() {
  const starter = 'betl: 1\nname: untitled\n\npipeline: []\n';
  loadYamlText(starter, 'untitled', null);
  toast('New pipeline (unsaved)');
}

document.getElementById('browseBtn').addEventListener('click', () => openBrowser(''));
document.getElementById('saveBtn').addEventListener('click', saveCurrent);
document.getElementById('newBtn').addEventListener('click', newPipeline);
document.getElementById('validateBtn').addEventListener('click', runValidate);
document.getElementById('convertBtn').addEventListener('click', openConvertBrowser);

/* ---------- tools (validate / convert) ---------- */
async function fetchToolsInfo() {
  try {
    const r = await fetch('/api/tools');
    if (!r.ok) return;
    const j = await r.json();
    state.tools = { betl: j.betl || null, dtsx2yaml: j.dtsx2yaml || null };
    updateToolButtons();
  } catch (_) { /* offline; leave defaults */ }
}

function updateToolButtons() {
  const vb = document.getElementById('validateBtn');
  const cb = document.getElementById('convertBtn');
  vb.disabled = !state.tools.betl;
  vb.title = state.tools.betl
    ? `Run \`betl validate\` on the loaded file`
    : 'betl binary not found — set $BETL_BIN or pass --betl';
  cb.disabled = !state.tools.dtsx2yaml;
  cb.title = state.tools.dtsx2yaml
    ? 'Pick a .dtsx and run dtsx2yaml'
    : 'dtsx2yaml binary not found — build it or set $BETL_DTSX2YAML';
}

async function runValidate() {
  if (!state.tools.betl) { toast('betl binary not configured', true); return; }
  if (!state.currentPath) { toast('Load a YAML file first', true); return; }
  // If there are unsaved edits, validating the saved file would
  // mislead — surface that rather than silently checking stale text.
  if (state.dirty) { toast('Save first — validate runs against the on-disk file', true); return; }
  openModal('Running betl validate…', '<div style="color:var(--muted)">working…</div>', '');
  let j;
  try {
    const r = await fetch('/api/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: state.currentPath }),
    });
    j = await r.json();
    if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
  } catch (e) {
    closeModal();
    toast('Validate failed: ' + e.message, true);
    return;
  }
  showToolResult('betl validate ' + state.currentPath, j);
}

function openConvertBrowser() {
  if (!state.tools.dtsx2yaml) { toast('dtsx2yaml not configured', true); return; }
  openDtsxBrowser('');
}

async function openDtsxBrowser(path) {
  let j;
  try {
    const r = await fetch('/api/list?exts=.dtsx&path=' + encodeURIComponent(path));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    j = await r.json();
  } catch (e) {
    toast('Browse failed: ' + e.message, true);
    return;
  }
  const upPath = path ? dirnameOf(path) : null;
  const upRow = upPath !== null
    ? `<div class="entry" data-kind="dir" data-path="${esc(upPath)}">
         <span class="icon">&#x21B0;</span><span class="name">..</span>
       </div>`
    : '';
  const dirRows = j.dirs.map((d) =>
    `<div class="entry" data-kind="dir" data-path="${esc(d.path)}">
       <span class="icon">&#128193;</span><span class="name">${esc(d.name)}</span>
     </div>`).join('');
  const fileRows = j.files.map((f) =>
    `<div class="entry" data-kind="file" data-path="${esc(f.path)}">
       <span class="icon">&#128462;</span><span class="name">${esc(f.name)}</span>
       <span class="size">${f.size} B</span>
     </div>`).join('');
  const where = j.path ? j.path : '<root>';
  const body = `
    <div class="bcrumb"><span class="root">root</span> / ${esc(where)}</div>
    <div class="entries">${upRow}${dirRows}${fileRows}
      ${(j.dirs.length + j.files.length === 0) ? '<div class="entry" style="color:var(--muted)">(no .dtsx here)</div>' : ''}
    </div>`;
  openModal('Pick a .dtsx to convert', body,
    `<button class="btn" onclick="closeModal()">Cancel</button>`);
  modalBody.querySelectorAll('.entry[data-kind="dir"]').forEach((el) =>
    el.addEventListener('click', () => openDtsxBrowser(el.dataset.path)));
  modalBody.querySelectorAll('.entry[data-kind="file"]').forEach((el) =>
    el.addEventListener('click', () => runConvert(el.dataset.path)));
}

async function runConvert(dtsxPath) {
  openModal('Running dtsx2yaml…',
    `<div style="color:var(--muted)">converting ${esc(dtsxPath)}…</div>`, '');
  let j;
  try {
    const r = await fetch('/api/convert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dtsx: dtsxPath }),
    });
    j = await r.json();
    if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
  } catch (e) {
    closeModal();
    toast('Convert failed: ' + e.message, true);
    return;
  }
  // On success, load the produced YAML; on failure, surface the
  // stdout/stderr like validate does.
  if (j.rc === 0 && j.output) {
    closeModal();
    toast('Converted → ' + j.output);
    loadServerFile(j.output);
  } else {
    showToolResult('dtsx2yaml ' + dtsxPath, j);
  }
}

function showToolResult(title, j) {
  const ok = j.rc === 0;
  const banner = ok
    ? `<div class="tr-banner ok">PASSED · rc = 0</div>`
    : `<div class="tr-banner err">FAILED · rc = ${j.rc}</div>`;
  const cmd = j.cmd && j.cmd.length
    ? `<div class="tr-cmd">$ ${esc(j.cmd.join(' '))}</div>`
    : '';
  const sections = [];
  if (j.stdout && j.stdout.length) sections.push(`<h4>stdout</h4><pre>${esc(j.stdout)}</pre>`);
  if (j.stderr && j.stderr.length) sections.push(`<h4>stderr</h4><pre>${esc(j.stderr)}</pre>`);
  if (!sections.length) sections.push(`<div style="color:var(--muted)">(no output)</div>`);
  const body = `<div class="tool-result">${banner}${cmd}${sections.join('')}</div>`;
  openModal(title, body, `<button class="btn" onclick="closeModal()">Close</button>`);
}

fetchToolsInfo();

/* orientation toggle */
document.getElementById('orientToggle').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-rankdir]');
  if (!b) return;
  state.rankdir = b.dataset.rankdir;
  document.querySelectorAll('#orientToggle button').forEach((x) => {
    x.classList.toggle('active', x === b);
  });
  // Swap orientation class on existing .v-flow div so the landscape
  // card variant takes effect before applyFlowLayout() re-measures.
  stage.querySelectorAll('.v-flow').forEach((el) => {
    el.classList.toggle('landscape', state.rankdir === 'LR');
    el.classList.toggle('portrait', state.rankdir !== 'LR');
  });
  applyFlowLayout();
});

/* view-mode toggle — visual pipeline vs raw YAML source */
document.getElementById('viewModeToggle').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-viewmode]');
  if (!b) return;
  const newMode = b.dataset.viewmode;
  if (newMode === state.viewMode) return;

  if (newMode === 'source') {
    // Refresh source text from the in-memory doc so inspector edits
    // become visible. If state.dirty was set from a prior source edit,
    // currentText is already authoritative — don't clobber.
    if (state.rawDoc && !(state.viewMode === 'source' && state.dirty)) {
      state.currentText = serializeRawDoc();
    }
    closeInspector();
  } else {
    // Returning to the visual view: re-parse the (possibly edited)
    // source. Refuse to switch on parse error so the user can fix it
    // without losing context.
    let doc;
    try {
      doc = jsyaml.load(state.currentText || '');
    } catch (err) {
      toast('Parse error: ' + err.message + ' — fix the source first', true);
      return;
    }
    state.rawDoc = (doc && typeof doc === 'object') ? doc : {};
    state.pipeline = buildPipelineView(state.rawDoc);
  }
  state.viewMode = newMode;
  document.querySelectorAll('#viewModeToggle button').forEach((x) =>
    x.classList.toggle('active', x === b));
  render();
});

/* port-mode toggle — partition source card or label the arrow */
document.getElementById('portModeToggle').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-portmode]');
  if (!b) return;
  state.portMode = b.dataset.portmode;
  document.querySelectorAll('#portModeToggle button').forEach((x) => {
    x.classList.toggle('active', x === b);
  });
  // Card structure changes (with/without .ports), so full re-render.
  render();
});

/* boot: render the empty state */
stage.innerHTML = `
  <div style="text-align:center; color:var(--muted); padding:60px 20px; font-family:var(--mono); font-size:13px;">
    no pipeline loaded
    <div style="margin-top:8px; font-size:12px;">use <b>browse&hellip;</b> to pick a YAML file</div>
  </div>`;
</script>
